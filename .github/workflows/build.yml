name: Build deb
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid
      - name: Build deb
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: com.nyxian.camera-deb
          path: build/*.deb
